services:
  - type: web
    name: lyra-wallet-backend
    runtime: node
    # The free plan works: protected keys live in PostgreSQL (DATABASE_URL,
    # e.g. Neon), not on this server's disk, which is wiped on every deploy.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: qwen/qwen-2.5-7b-instruct
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # 32-byte hex key (64 chars): generate once, keep a copy somewhere safe.
      # Losing it makes every stored protected key unreadable.
      - key: MPC_MASTER_KEY
        sync: false
      # Neon (or any PostgreSQL) connection string, e.g.
      # postgresql://user:password@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
